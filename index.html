<style>
/* Layout: uma coluna estreita, uma pergunta por tela, como um instrumento de consultório; resultado vira um laudo de rastreio com barras por escala */
:root{
  --bg:#EEF2F4; --paper:#FFFFFF; --ink:#13202A; --muted:#5A6B77; --line:#D3DCE2;
  --accent:#0B7A63; --accent-ink:#FFFFFF; --mid:#B86E00; --high:#0B7A63; --low:#7C8C97; --alert:#B3261E; --alert-bg:#FBEAE8;
  --track:#E1E8EC;
  --f-display:"Bricolage Grotesque", "Arial Narrow", Arial, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1419; --paper:#152029; --ink:#E4EBEF; --muted:#93A5B1; --line:#26343F;
  --accent:#3CC4A1; --accent-ink:#06231C; --mid:#E9A443; --high:#3CC4A1; --low:#6E808C; --alert:#FF8A80; --alert-bg:#3A1714; --track:#22303A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1419; --paper:#152029; --ink:#E4EBEF; --muted:#93A5B1; --line:#26343F;
  --accent:#3CC4A1; --accent-ink:#06231C; --mid:#E9A443; --high:#3CC4A1; --low:#6E808C; --alert:#FF8A80; --alert-bg:#3A1714; --track:#22303A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(2rem,6vw,2.8rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 20px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--mid);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.note{border-left:3px solid var(--mid);padding:4px 0 4px 14px;color:var(--muted);font-size:.95rem}
.aviso{background:var(--alert-bg);color:var(--ink);border:1px solid var(--alert);border-radius:12px;padding:16px}
.aviso strong{color:var(--alert)}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* contexto */
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.92rem}
input[type=number],input[type=text]{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
/* pergunta */
.progress{height:6px;background:var(--track);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qtext{font-size:clamp(1.25rem,3.6vw,1.6rem);font-family:var(--f-display);font-weight:600;line-height:1.3;min-height:4.2em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.opt .k{font-family:var(--f-mono);width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line);font-size:.85rem}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--paper))}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{font-size:.85rem;color:var(--muted)}
/* resultado */
.res{display:flex;flex-direction:column;gap:6px;padding-block:14px;border-top:1px solid var(--line)}
.res:first-child{border-top:0;padding-top:0}
.reshead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.score{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.95rem}
.bar{position:relative;height:12px;background:var(--track);border-radius:99px}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.bar>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.6}
.pill{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.lv-alto{color:var(--high)} .lv-medio{color:var(--mid)} .lv-baixo{color:var(--low)} .lv-alerta{color:var(--alert)}
details{border-top:1px solid var(--line);padding-top:10px}
details summary{cursor:pointer;font-weight:700}
dl{margin:0;display:flex;flex-direction:column;gap:12px}
dt{font-weight:700}
dd{margin:2px 0 0;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.sitbox{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.sitbox:first-of-type{border-top:0}
.sitbox blockquote{margin:0;padding:10px 14px;background:var(--bg);border-radius:10px;font-style:italic}
textarea{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;resize:vertical}
textarea:focus-visible{outline:3px solid var(--mid);outline-offset:2px}
.consent{flex-direction:row;align-items:flex-start;gap:10px;font-size:.92rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.consent input{margin-top:3px;width:18px;height:18px;flex:none}
/* mapa visual */
.wrap.wide{max-width:760px}
.glance{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:620px){.glance{grid-template-columns:1fr}}
.radar{width:100%;height:auto;display:block}
.rd-band-hi{fill:color-mix(in srgb,var(--high) 10%,transparent)}
.rd-band-mid{fill:color-mix(in srgb,var(--mid) 12%,transparent)}
.rd-band-lo{fill:var(--track)}
.rd-axis{stroke:var(--line);stroke-width:1}
.rd-shape{fill:color-mix(in srgb,var(--high) 22%,transparent);stroke:var(--high);stroke-width:2.5;stroke-linejoin:round}
.rd-label{fill:var(--ink);font-family:var(--f-body);font-size:13px}
.levels{display:flex;flex-direction:column;gap:14px}
.levels h4{margin:0 0 6px;font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.85rem;padding:4px 10px;border-radius:99px;border:1px solid currentColor;background:var(--paper)}
.mapcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--mc,var(--line))}
.mapcard:has(.lv-alto){--mc:var(--high)} .mapcard:has(.lv-medio){--mc:var(--mid)} .mapcard:has(.lv-alerta){--mc:var(--alert)}
.mc-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.mapcard h4{margin:6px 0 0;font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.cenas{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.cenas li{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.95rem;line-height:1.45}
@media (prefers-reduced-motion:reduce){.progress>i{transition:none}}
</style>

</head>

<script>
const LIK = ["Discordo totalmente","Discordo","Neutro","Concordo","Concordo totalmente"];
const FREQ = ["Nenhuma vez","Vários dias","Mais da metade dos dias","Quase todos os dias"];

const SCALES = [
 {id:"soc", nome:"Comunicação e interação social", base:"AQ e RAADS-R", tipo:"lik", termo:"Traços autistas sociais",
  explica:"Mede o quanto a interação social exige esforço consciente: entender indiretas, saber a vez de falar, achar conversa fiada sem sentido. No autismo isso costuma estar presente desde a infância.",
  oficial:"AQ-10 (corte 6 ou mais) ou AQ-50 (32 ou mais), do Autism Research Centre de Cambridge; RAADS-R (65 ou mais).",
  itens:[["Em conversa em grupo, muitas vezes não sei quando é a minha vez de falar."],["Percebo com facilidade quando alguém está entediado com o que eu digo.",1],["Já me disseram que fui grosso ou inconveniente quando eu só estava sendo sincero."],["Ironia, indireta e \"ler nas entrelinhas\" me cansam ou me confundem."],["Conversa fiada (tempo, fofoca, como foi o fim de semana) me parece inútil."],["Prefiro conversar sobre um assunto que me interessa a conversar sobre pessoas."],["Depois de um evento social, repasso a conversa tentando descobrir se errei algo."],["Fazer amizades novas e mantê-las sempre foi natural para mim.",1],["Desde criança eu sentia que os outros tinham um manual social que eu não recebi."]]},
 {id:"sen", nome:"Sensorial", base:"RAADS-R, domínio sensório-motor", tipo:"lik", termo:"Sensibilidade sensorial",
  explica:"Mede o quanto som, luz, textura e multidão te afetam. Hipersensibilidade sensorial é um dos critérios do autismo no DSM-5 e também aparece em pessoas com altas habilidades.",
  oficial:"RAADS-R, subescala sensório-motora; avaliação com terapeuta ocupacional.",
  itens:[["Barulhos que os outros nem notam (ventilador, mastigação, tic-tac) me incomodam muito."],["Lugares cheios, com luz forte e muito som, me esgotam rápido."],["Algumas texturas de roupa ou comida são insuportáveis para mim."],["Consigo trabalhar tranquilo num ambiente barulhento.",1],["Quando estou sobrecarregado, preciso de silêncio ou escuro para voltar ao normal."],["Tenho movimentos repetitivos que me acalmam (balançar a perna, mexer em objetos, andar)."]]},
 {id:"rot", nome:"Rotina e interesses intensos", base:"AQ e RAADS-R, interesses restritos", tipo:"lik", termo:"Interesses restritos e rigidez",
  explica:"Mede apego a rotina, desconforto com mudanças e interesses que viram obsessão. Hiperfoco é ficar preso num assunto a ponto de esquecer o corpo; no flow você também mergulha, mas sai bem.",
  oficial:"AQ-50 (subescalas troca de atenção e atenção a detalhes) e RAADS-R (interesses restritos).",
  itens:[["Mudanças de plano de última hora me desorganizam por dentro, mesmo que eu disfarce."],["Quando um assunto me pega, estudo por horas e esqueço de comer ou dormir."],["Tenho ou tive temas que viram obsessão por meses, e falo deles mais do que os outros aguentam."],["Gosto de fazer as coisas sempre do mesmo jeito."],["Noto padrões, números e detalhes que os outros não percebem."],["Mudo de rotina com facilidade e sem custo nenhum.",1],["Organizar, classificar e sistematizar coisas me dá prazer."]]},
 {id:"cam", nome:"Camuflagem social (masking)", base:"CAT-Q", tipo:"lik", termo:"Masking",
  explica:"Masking é esconder ou compensar seu jeito natural para se encaixar: ensaiar conversas, copiar expressões, usar humor como escudo. Quem mascara muito pode pontuar baixo nos testes de autismo e mesmo assim ser autista, e paga com exaustão.",
  oficial:"CAT-Q (25 itens, 25 a 175 pontos), com versão brasileira validada; não tem corte oficial, serve para comparar.",
  itens:[["Em situações sociais, sinto que estou atuando um personagem."],["Estudei pessoas, filmes ou séries para aprender como agir socialmente."],["Ensaio mentalmente conversas antes de acontecerem."],["Ajusto conscientemente minha expressão facial e meu contato visual para parecer \"normal\"."],["Uso humor para disfarçar quando não sei como agir."],["Depois de socializar, preciso de muito tempo sozinho para me recuperar."],["As pessoas ficariam surpresas se soubessem quanto esforço eu faço para parecer à vontade."],["Sou exatamente o mesmo com todo mundo, sem esforço.",1],["Sinto que ninguém conhece o meu \"eu\" de verdade."]]},
 {id:"bur", nome:"Burnout e shutdown", base:"Raymaker et al., 2020; AASPIRE Autistic Burnout Measure", tipo:"lik", termo:"Burnout autista e shutdown",
  explica:"Burnout autista é exaustão crônica, perda de habilidades que você tinha e menos tolerância a estímulo, vinda de exigência acima da capacidade por muito tempo. Shutdown é o desligamento: ficar sem palavras, travado, precisando sumir. Meltdown é a versão explosiva.",
  oficial:"AASPIRE Autistic Burnout Measure, revisada (14 itens); leve o resultado ao psiquiatra, porque se parece com depressão e as duas podem coexistir.",
  itens:[["Há períodos em que só consigo deitar e não falar com ninguém, mesmo com coisas importantes para fazer."],["Nesses períodos, coisas que eu fazia fácil (responder mensagem, falar em reunião) ficam quase impossíveis."],["Quando estou sobrecarregado, \"desligo\": fico sem palavras, travado ou ausente."],["Meu cansaço não melhora com uma boa noite de sono ou um fim de semana."],["Estímulos que eu tolerava (barulho, gente, notificação) passaram a me irritar mais."],["Sinto que as exigências da minha vida estão muito acima da energia que eu tenho."],["Quando consigo reduzir as exigências e ficar mais \"eu mesmo\", melhoro."],["Esse padrão vem piorando nos últimos meses."]]},
 {id:"tda", nome:"Atenção e impulsividade", base:"ASRS-18 (OMS)", tipo:"lik", termo:"TDAH",
  explica:"TDAH é uma dificuldade de autorregulação: atenção, freio e organização das tarefas, não de inteligência. Precisa estar presente desde a infância. Combina com procrastinação de tarefas chatas e hiperfoco no que interessa.",
  oficial:"ASRS-18, versão brasileira na ABDA (tdah.org.br): 4 ou mais itens em \"frequentemente\" numa das partes sugere investigar.",
  itens:[["Deixo tarefas chatas para a última hora, mesmo sabendo que vou me prejudicar."],["Começo muitos projetos e termino poucos."],["Me distraio com facilidade com coisas ao redor ou com meus próprios pensamentos."],["Perco prazos, esqueço compromissos ou perco objetos com frequência."],["Em reunião longa, fico inquieto e preciso me mexer."],["Termino a frase dos outros ou respondo antes de terminarem a pergunta."],["Tenho dificuldade de esperar minha vez."],["Quando algo me interessa muito, entro em hiperfoco e perco a noção do tempo."],["Organizo e concluo tarefas cheias de detalhes sem dificuldade.",1],["Isso acontece desde a infância ou adolescência, não só agora."]]},
 {id:"ahs", nome:"Altas habilidades", base:"Renzulli (três anéis) e Dabrowski (sobre-excitabilidades)", tipo:"lik", termo:"AH/SD (superdotação)",
  explica:"Altas habilidades/superdotação (AH/SD ou AHSD) é capacidade acima da média somada a criatividade e envolvimento intenso com o que interessa. Vem junto com sobre-excitabilidades: mente que não desliga, emoção e senso de justiça intensos. Quando aparece junto de autismo ou TDAH, chama-se dupla excepcionalidade (2e).",
  oficial:"Avaliação neuropsicológica completa e presencial, com a escala Wechsler para adultos (WAIS), história de vida e entrevista com quem te conheceu na infância. Não existe questionário nem teste de QI online que confirme superdotação.",
  itens:[["Aprendo assuntos novos muito mais rápido que as pessoas ao meu redor."],["Faço associações entre áreas distantes que surpreendem os outros."],["Tenho dificuldade em ser iniciante: quando não sou bom logo, largo."],["Questiono regras e autoridade quando não vejo lógica nelas."],["Sinto injustiças e questões morais com uma intensidade que os outros acham exagerada."],["Minha cabeça não desliga: penso em várias coisas ao mesmo tempo, até na hora de dormir."],["Me entedio rápido com tarefas repetitivas e sem desafio."],["Desde cedo eu preferia conversar com adultos ou com pessoas mais velhas."],["Na escola eu aprendia quase sem esforço e o ritmo da aula me entediava."],["Quando criança, usava palavras e fazia perguntas que os adultos achavam avançadas para a minha idade."],["Mesmo indo bem, muitas vezes me sinto uma fraude que vai ser descoberta."]]},
 {id:"int", nome:"Intensidade e sentido", base:"sobre-excitabilidades de Dabrowski; Frankl e Yalom sobre sofrimento existencial", tipo:"lik", termo:"Neurointensidade",
  explica:"Mede o quanto você vive tudo mais forte: pensamento que não para, emoção profunda, imaginação, energia física, perfeccionismo e uma busca constante de sentido. Dabrowski chamou isso de sobre-excitabilidades e via as crises como parte do desenvolvimento. É comum em altas habilidades, mas não depende de QI alto, e explica boa parte do sofrimento de quem se sente 'demais' para o ambiente.",
  oficial:"Não há teste clínico. A pesquisa usa o OEQ-II (Overexcitability Questionnaire); o caminho prático é falar disso com o psicólogo e procurar pares que funcionam parecido.",
  itens:[["Penso em tudo em camadas e tenho dificuldade de 'desligar' a análise, mesmo quando quero."],["Sinto as emoções com uma profundidade que as pessoas ao redor não parecem sentir."],["Minha imaginação é tão viva que às vezes me perco nos meus próprios mundos e cenários."],["Tenho uma energia física inquieta: falo rápido, gesticulo, preciso estar em movimento."],["Conversas superficiais me dão um tédio quase físico."],["Sou muito exigente comigo: o que faço quase nunca parece bom o suficiente."],["Erros pequenos meus ficam ecoando na minha cabeça por dias."],["Preciso ver sentido no que faço; sem isso, não consigo me mover."],["Já vivi crises sobre o sentido da vida que as pessoas ao redor não entendiam."],["Sinto que estou no lugar errado do mundo, como se não pertencesse a lugar nenhum."],["Encontrar alguém que pensa no meu ritmo me dá um alívio enorme, e isso é raro."]]},
 {id:"hum", nome:"Humor cíclico", base:"TEMPS-A (Akiskal) e depressão breve recorrente (Angst)", tipo:"lik", termo:"Ciclotimia e hipertimia",
  explica:"Temperamento hipertímico é energia alta quase sempre; ciclotímico é oscilar em ciclos curtos entre muito para cima e para baixo. Depressão breve recorrente são quedas de poucos dias que voltam. É importante porque, se houver algo do espectro bipolar, o tratamento muda.",
  oficial:"TEMPS-A ou MDQ (Mood Disorder Questionnaire), sempre com psiquiatra, antes de qualquer antidepressivo.",
  itens:[["Tenho fases de energia lá em cima, com pouca necessidade de sono, ideias a mil e vontade de fazer tudo."],["Nessas fases, já gastei dinheiro, assumi compromissos ou tomei decisões de que me arrependi."],["Meu humor muda de \"no topo do mundo\" para \"no chão\" sem um motivo claro."],["Tenho episódios de tristeza ou apatia que duram poucos dias e depois passam sozinhos."],["Esses episódios curtos voltam com certa regularidade (por exemplo, todo mês)."],["Pessoas próximas já comentaram que eu tenho \"fases\"."],["Minha energia e meu humor são praticamente iguais o ano todo.",1],["Tenho parentes com diagnóstico de bipolaridade, depressão ou dependência química."]]},
 {id:"phq", nome:"Depressão (últimas 2 semanas)", base:"PHQ-9, domínio público", tipo:"freq", termo:"Depressão",
  explica:"O PHQ-9 é o questionário mais usado no mundo para rastrear depressão. Ele mede as últimas duas semanas, então mostra como você está agora, não quem você é.",
  oficial:"Esta escala já é o instrumento oficial. Cortes: 5 leve, 10 moderada, 15 moderadamente grave, 20 grave.",
  itens:[["Pouco interesse ou pouco prazer em fazer as coisas."],["Se sentir para baixo, deprimido ou sem perspectiva."],["Dificuldade para pegar no sono, permanecer dormindo, ou dormir mais do que de costume."],["Se sentir cansado ou com pouca energia."],["Falta de apetite ou comer demais."],["Se sentir mal consigo mesmo, achar que é um fracasso ou que decepcionou a família ou a si mesmo."],["Dificuldade para se concentrar nas coisas, como ler ou ver TV."],["Lentidão para se movimentar ou falar, a ponto de outros notarem; ou o contrário, agitação fora do normal."],["Pensar em se ferir de alguma maneira ou que seria melhor estar morto."]]},
 {id:"gad", nome:"Ansiedade (últimas 2 semanas)", base:"GAD-7, domínio público", tipo:"freq", termo:"Ansiedade",

const KEY = "mapa-da-mente-v4";

let st = {step:"intro", idx:0, ans:{}, ctx:{nome:"",idade:"",med:"",E:"",C:"",N:"",A:"",O:""}};
try{ const saved = JSON.parse(localStorage.getItem(KEY)||"null"); if(saved && saved.ans) st = Object.assign(st, saved); }catch(e){}

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  if(st.step!=="res") app.classList.remove("wide");
  if(st.step==="intro") return renderIntro();
  if(st.step==="ctx") return renderCtx();
  if(st.step==="q") return renderQ();
  if(st.step==="sit") return renderSit();
  if(st.step==="res") return renderRes();
}

function scaleOf(id){ return SCALES.find(s => s.id===id); }

function renderQ(){
  const it = ITEMS[st.idx]; const s = scaleOf(it.s);
  const opts = s.tipo==="lik" ? LIK : FREQ;
  const cur = st.ans[st.idx];
  const sNum = SCALES.indexOf(s)+1;
  app.innerHTML = `
  <div class="progress" aria-hidden="true"><i style="width:${(st.idx/TOTAL*100).toFixed(1)}%"></i></div>
  <div class="qmeta"><span>Escala ${sNum} de ${SCALES.length} · ${esc(s.nome)}</span><span>${st.idx+1} / ${TOTAL}</span></div>
  <div class="card">
    ${s.tipo==="freq" ? '<p class="hint">Nas últimas 2 semanas, com que frequência isso te incomodou?</p>' : ""}
    <p class="qtext" id="qt">${esc(it.t)}</p>
    <div class="opts" role="radiogroup" aria-labelledby="qt">
      ${opts.map((o,k) => `<button class="opt ${cur===k?"sel":""}" role="radio" aria-checked="${cur===k}" data-k="${k}"><span class="k">${k+1}</span><span>${o}</span></button>`).join("")}
    </div>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="prev" ${st.idx===0?"disabled":""}>Voltar</button>
      ${cur!==undefined ? '<button class="btn" id="next">Avançar</button>' : '<span class="hint">Escolha uma opção para seguir</span>'}
    </div>
  </div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
  document.getElementById("prev").onclick = () => { if(st.idx>0){ st.idx--; save(); render(); } };
  const n = document.getElementById("next"); if(n) n.onclick = advance;
}
function answer(k){
  st.ans[st.idx] = k; save();
  render();
  setTimeout(advance, 160);
}
function advance(){
  if(st.ans[st.idx]===undefined) return;
  if(st.idx < TOTAL-1){ st.idx++; } else { st.idx = TOTAL; st.step = "sit"; }
  save(); render(); window.scrollTo(0,0);
}
document.addEventListener("keydown", e => {
  if(st.step!=="q" || e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA") return;
  const s = scaleOf(ITEMS[st.idx].s); const max = s.tipo==="lik"?5:4;
  const n = parseInt(e.key,10);
  if(n>=1 && n<=max){ answer(n-1); }
  else if(e.key==="ArrowLeft" && st.idx>0){ st.idx--; save(); render(); }
  else if(e.key==="ArrowRight"||e.key==="Enter"){ advance(); }
});

/* ---------- pontuação ---------- */
function scores(){
  const out = {};
  SCALES.forEach(s => {
    const vals = [];
    ITEMS.forEach((it,ix) => { if(it.s!==s.id) return; const a = st.ans[ix]; if(a===undefined) return;
      vals.push(s.tipo==="lik" ? (it.r ? 5-a : a+1) : a); });
    if(s.tipo==="lik"){
      const m = vals.length ? vals.reduce((x,y)=>x+y,0)/vals.length : 0;
      out[s.id] = {v:m, txt:m.toFixed(1).replace(".",",")+" / 5", pct:(m-1)/4, lv: m>=3.5?"alto":m>=2.5?"medio":"baixo"};
    } else {
      const sum = vals.reduce((x,y)=>x+y,0); const max = s.itens.length*3;
      let lv, lab;
      if(s.id==="phq"){ lab = sum>=20?"grave":sum>=15?"moderadamente grave":sum>=10?"moderada":sum>=5?"leve":"mínima"; }
      else { lab = sum>=15?"grave":sum>=10?"moderada":sum>=5?"leve":"mínima"; }
      lv = sum>=10?"alerta":sum>=5?"medio":"baixo";
      out[s.id] = {v:sum, txt:sum+" / "+max+" · "+lab, pct:sum/max, lv, lab};
    }
  });
  const phq9 = ITEMS.findIndex(it => it.s==="phq" && it.i===8);
  out.risco = (st.ans[phq9]||0) >= 1;
  const tdaInf = ITEMS.findIndex(it => it.s==="tda" && it.i===9);
  out.tdaInfancia = (st.ans[tdaInf]||0) >= 3;
  return out;
}
const LVTXT = {alto:"Bem presente", medio:"Intermediário", baixo:"Pouco presente", alerta:"Atenção"};

function synthesis(sc){
  const L = [], Q = [];
  const aut = (sc.soc.v+sc.sen.v+sc.rot.v)/3;
  if(aut>=3.5){ L.push("Traços autistas bem presentes nas três áreas (social, sensorial e rotina). Vale fazer o AQ-50 ou o RAADS-R oficiais e buscar avaliação para autismo.");
    Q.push("Meus traços sociais, sensoriais e de rotina justificam uma avaliação para autismo?"); }
  else if(aut>=2.5 && sc.cam.v>=3.5){ L.push("Traços autistas em zona intermediária com masking alto. Esse é o padrão de quem pode ser autista e esconder bem, comum em diagnósticos tardios.");
    Q.push("O meu nível de camuflagem pode estar escondendo traços autistas?"); }
  else if(aut>=2.5){ L.push("Traços autistas em zona intermediária. Pode ser autismo leve, outra condição com sobreposição (TDAH, ansiedade social, altas habilidades) ou só um jeito de ser.");
    Q.push("Meus traços autistas intermediários pedem investigação ou se explicam por outra coisa?"); }
  else { L.push("Poucos traços autistas pelo que você respondeu."); }
  if(sc.cam.lv==="alto" && aut<2.5) L.push("Masking alto mesmo com poucos traços autistas: vale observar se é ansiedade social ou esforço de adaptação ao ambiente.");
  if(sc.tda.lv==="alto"){ L.push(sc.tdaInfancia ? "Sinais de desatenção e impulsividade fortes e presentes desde cedo. TDAH é uma hipótese séria: faça o ASRS-18 da ABDA e leve ao psiquiatra." : "Sinais de desatenção e impulsividade fortes, mas sem clareza de que vêm da infância. Isso é essencial para o diagnóstico de TDAH; burnout e depressão também derrubam a atenção.");
    Q.push("Meus sinais de atenção e impulsividade são TDAH ou efeito de sobrecarga?"); }
  else if(sc.tda.lv==="medio") L.push("Atenção e impulsividade em zona intermediária.");
  if(sc.int.lv==="alto"){ L.push("Intensidade e busca de sentido bem altas. Boa parte do cansaço pode vir do choque entre essa intensidade e um ambiente que não acompanha. Encontrar pares que funcionam parecido costuma aliviar tanto quanto tratamento.");
    Q.push("Como lidar com perfeccionismo, autocrítica e crises de sentido sem me apagar?"); }
  if(sc.int.lv==="alto" && (sc.ahs.lv!=="baixo") && (sc.cam.lv!=="baixo" || sc.bur.lv!=="baixo")) L.push("Seu padrão (intensidade alta, sinais de altas habilidades e desgaste social) é o que a pesquisadora Elô Lima descreve no artigo Síndrome dos Inteligentes, uma proposta não clínica para dar nome a esse sofrimento. Vale ler: elo.barbarulo.com.br.");
  if(sc.ahs.lv==="alto"){ L.push("Muitos sinais de altas habilidades e intensidade. Só a avaliação neuropsicológica com WAIS confirma; se houver autismo ou TDAH junto, pergunte sobre dupla excepcionalidade.");
    Q.push("Faz sentido incluir investigação de altas habilidades (WAIS e GAI) na minha avaliação?"); }
  if(sc.hum.lv==="alto"){ L.push("Oscilações de energia e humor bem presentes. Antes de qualquer antidepressivo, o psiquiatra precisa investigar o espectro bipolar.");
    Q.push("Minhas oscilações de energia e humor indicam ciclotimia ou espectro bipolar?"); }
  else if(sc.hum.lv==="medio") L.push("Oscilações de humor em zona intermediária: vale anotar por um mês quando a energia sobe e quando cai.");
  if(sc.bur.lv==="alto"){ L.push("Sinais fortes de burnout e shutdown. A exigência está acima da sua capacidade agora: reduzir carga e masking ajuda tanto quanto entender o diagnóstico.");
    Q.push("O que estou vivendo é burnout, depressão ou os dois?"); }
  if(sc.phq.v>=10){ L.push("O PHQ-9 indica depressão "+sc.phq.lab+" nas últimas duas semanas. Isso merece consulta logo, não só quando der.");
    Q.push("Meu resultado no PHQ-9 foi "+sc.phq.v+". Preciso de tratamento para depressão agora?"); }
  if(sc.gad.v>=10){ L.push("O GAD-7 indica ansiedade "+sc.gad.lab+" nas últimas duas semanas.");
    Q.push("Minha ansiedade é um quadro próprio ou consequência de outra coisa?"); }
  if(sc.fri.v<2.5) L.push("Traços frios baixos: você sente culpa, empatia e se importa com os outros. A dúvida da psicopatia está respondida.");
  else if(sc.fri.v<3.5) L.push("Traços frios em zona intermediária, puxados geralmente por impulsividade e gosto por risco, não por falta de empatia. Compare com a escala de atenção.");
  else { L.push("Traços frios altos. Vale conversar com um psicólogo sobre empatia e impulsividade."); Q.push("Meus traços de impulsividade e frieza merecem acompanhamento?"); }
  return {L, Q};
}

function bigFive(sc){
  const c = st.ctx, n = k => c[k]==="" ? null : +c[k];
  const E=n("E"), C=n("C"), N=n("N"), A=n("A"), O=n("O"), out=[];
  if(E!==null && E>=70 && (sc.soc.v+sc.sen.v+sc.rot.v)/3>=2.5) out.push("Você é bem extrovertido (percentil "+E+") e mesmo assim tem traços autistas intermediários ou altos. Em média, autistas são mais introvertidos; extroversão alta com masking alto é o perfil do autista sociável que esconde bem.");
  if(E!==null && E>=70 && sc.bur.lv==="alto") out.push("Com extroversão no percentil "+E+", o cansaço social provavelmente não vem de gente em si, e sim do tipo de interação: cobrança, conflito e máscara o dia inteiro.");
  if(C!==null && C<=35 && sc.tda.lv!=="baixo") out.push("Conscienciosidade no percentil "+C+" somada aos sinais de atenção reforça a hipótese de TDAH ou de sobrecarga executiva.");
  if(N!==null && N<=30 && (sc.phq.v>=10 || sc.bur.lv==="alto")) out.push("Seu neuroticismo era baixo (percentil "+N+"), mas hoje há sinais de depressão ou burnout. Essa mudança é um dado clínico: conte ao médico quando ela começou.");
  if(N!==null && N>=70 && sc.gad.v>=10) out.push("Neuroticismo alto (percentil "+N+") combina com a ansiedade atual; parte dela pode ser temperamento de base.");
  if(A!==null && A>=50 && sc.fri.v<3.5) out.push("Amabilidade no percentil "+A+" é mais um sinal contra psicopatia, cujo marcador central é amabilidade muito baixa.");
  if(O!==null && O>=70 && sc.ahs.lv!=="baixo") out.push("Abertura no percentil "+O+" combina com os sinais de altas habilidades: curiosidade intelectual alta.");
  return out;
}

const LIKERT_IDS = ["soc","sen","rot","cam","bur","tda","ahs","int","hum","fri"];
const LVCOR = {alto:"var(--high)", medio:"var(--mid)", baixo:"var(--low)", alerta:"var(--alert)"};

function radarSVG(sc){
  const N = LIKERT_IDS.length, cx = 200, cy = 190, R = 130;
  const pt = (i, v) => { const a = -Math.PI/2 + i*2*Math.PI/N; const r = R*(v-1)/4; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
  const ring = v => LIKERT_IDS.map((_,i) => pt(i,v).map(n=>n.toFixed(1)).join(",")).join(" ");
  const poly = LIKERT_IDS.map((id,i) => pt(i, Math.max(1, sc[id].v)).map(n=>n.toFixed(1)).join(",")).join(" ");
  const axes = LIKERT_IDS.map((id,i) => { const [x,y] = pt(i,5); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="rd-axis"/>`; }).join("");
  const labels = LIKERT_IDS.map((id,i) => { const [x,y] = pt(i,5.75); const anchor = Math.abs(x-cx) < 8 ? "middle" : (x > cx ? "start" : "end");
    return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${anchor}" class="rd-label">${VIDA[id].curto}</text>`; }).join("");
  const dots = LIKERT_IDS.map((id,i) => { const [x,y] = pt(i, Math.max(1, sc[id].v)); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" style="fill:${LVCOR[sc[id].lv]}"/>`; }).join("");
  return `<svg viewBox="-40 0 480 380" role="img" aria-label="Radar com as 10 áreas do teste" class="radar">
    <polygon points="${ring(5)}" class="rd-band-hi"/><polygon points="${ring(3.5)}" class="rd-band-mid"/><polygon points="${ring(2.5)}" class="rd-band-lo"/>
    ${axes}<polygon points="${poly}" class="rd-shape"/>${dots}${labels}</svg>`;
}

    <div class="bar" role="img" aria-label="${esc(s.nome)}: ${esc(r.txt)}"><i style="width:${Math.max(2,r.pct*100).toFixed(1)}%;background:${LVCOR[r.lv]}"></i></div>

function lerSituacao(txt){
  const t = txt.toLowerCase();
  const hits = Object.entries(PISTAS).map(([id, ws]) => [id, ws.filter(w => t.includes(w)).length]).filter(x => x[1] > 0);
  hits.sort((a,b) => b[1]-a[1]);
  return hits.slice(0,3).map(x => x[0]);
}
function sitChave(){ return JSON.stringify((st.sit||[]).map(x => (x||"").trim()).filter(Boolean)); }
function situacoesLidas(sc){
  const ia = st.sitIA && st.sitIA.chave === sitChave() ? st.sitIA.leituras : null;
  return (st.sit||[]).filter(x => x && x.trim()).map((txt, i) => {
    if(ia && ia[i]) return {txt: txt.trim(), ids: ia[i].areas.filter(id => VIDA[id]), porque: ia[i].porque, ajuda: ia[i].ajuda, ia: true};
    const ids = lerSituacao(txt);
    // desempata pelas áreas que mais pontuaram no teste
    ids.sort((a,b) => (sc[b] ? sc[b].pct : 0) - (sc[a] ? sc[a].pct : 0));

  });
}

function rankScales(sc){
  const present = [], quiet = [];

  return {present, quiet};
}

async function salvarResposta(sc){
  if(st.consent !== true || st.salvo) return;
  if(!st.sessao) { st.sessao = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)); save(); }

  const ia = st.sitIA && st.sitIA.chave === chave ? st.sitIA.leituras : null;

  const respostas = ITEMS.map((it, ix) => ({n: ix+1, escala: it.s, pergunta: it.t, invertido: it.r, valor: st.ans[ix] === undefined ? null : (scaleOf(it.s).tipo==="lik" ? st.ans[ix]+1 : st.ans[ix])}));
  try{
    const r = await fetch("/api/salvar-resposta", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({
      consentimento: true, sessao: st.sessao, versao: "2026-11-02", nome: st.ctx.nome || "", idade: st.ctx.idade || "", medicacao: st.ctx.med || "",
      escores, respostas, situacoes: JSON.parse(chave), leitura_ia: ia })});
    if(!r.ok) throw new Error("http " + r.status);
    st.salvo = true; save();
    const el = document.getElementById("salvostatus"); if(el) el.textContent = "Suas respostas estão guardadas.";
  }catch(e){ /* tenta de novo na próxima vez que o resultado abrir */ }
}

async function pedirLeituraIA(sc){
  const chave = sitChave();
  if(chave === "[]" || (st.sitIA && st.sitIA.chave === chave)) return;
  const status = document.getElementById("sitstatus");
  if(status) status.textContent = "Lendo suas situações com a IA do Mapa da Mente...";
  try{
    const escores = {}; SCALES.forEach(s => escores[s.id] = sc[s.id].txt + " (" + LVTXT[sc[s.id].lv] + ")");
    const r = await fetch("/api/ler-situacoes", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({situacoes: JSON.parse(chave), escores})});
    if(!r.ok) throw new Error("http " + r.status);
    const data = await r.json();
    if(!Array.isArray(data.leituras) || !data.leituras.length) throw new Error("vazio");
    st.sitIA = {chave, leituras: data.leituras}; save();
    const sec = document.getElementById("sitsec");
    if(sec && st.step==="res"){ const tmp = document.createElement("div"); tmp.innerHTML = sitHTML(sc); sec.replaceWith(tmp.firstElementChild); }
  }catch(e){
    if(status) status.textContent = "Leitura por palavras-chave (a leitura com IA não respondeu agora).";
  }
}

/* ---------- PDF ---------- */
async function makePdf(sc, syn, bf){
  const msg = document.getElementById("pdfmsg");
  if(!window.jspdf){ msg.textContent = "O gerador de PDF não carregou. Recarregue a página e tente de novo."; return; }
  const { jsPDF } = window.jspdf;
  const d = new jsPDF({unit:"mm", format:"a4"});
  const W = 210, M = 16, CW = W-2*M, BOTTOM = 280; let y = 20;
  const ink=[19,32,42], mut=[90,107,119], line=[211,220,226], track=[225,232,236];
  const COL = {alto:[11,122,99], medio:[184,110,0], baixo:[124,140,151], alerta:[179,38,30]};
  const TINT = {alto:[231,244,240], medio:[252,242,226], baixo:[240,243,245], alerta:[251,234,232]};
  const newPage = () => { d.addPage(); y = 20; };
  const need = h => { if(y+h > BOTTOM) newPage(); };
  const wrap = (txt, size, w) => { d.setFontSize(size); return d.splitTextToSize(txt, w); };
  const para = (txt, size=10, color=ink, style="normal", gap=1.5, x=M, w=CW) => {
    d.setFont("helvetica", style); const lines = wrap(txt, size, w); const lh = size*0.42; d.setTextColor(...color);
    lines.forEach(l => { need(lh); d.text(l, x, y); y += lh; }); y += gap;
  };
  const bullet = (txt, x=M, w=CW) => {
    d.setFont("helvetica","normal"); const lines = wrap(txt, 10, w-5); const lh = 4.2; d.setTextColor(...ink);
    need(lh*lines.length); d.text("•", x, y); lines.forEach(l => { d.text(l, x+5, y); y += lh; }); y += 1.2;
  };
  const head = (txt) => { y += 4; need(12); d.setFont("helvetica","bold"); d.setFontSize(14); d.setTextColor(...ink); d.text(txt, M, y); y += 2.5; d.setDrawColor(...line); d.line(M, y, W-M, y); y += 6; };
  const poly = (pts, style) => { const segs = []; for(let i=1;i<pts.length;i++) segs.push([pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]]); d.lines(segs, pts[0][0], pts[0][1], [1,1], style, true); };

  // capa
  d.setFillColor(...ink); d.rect(0, 0, W, 38, "F");
  d.setTextColor(255,255,255); d.setFont("helvetica","bold"); d.setFontSize(24); d.text("Mapa da Mente", M, 19);
  d.setFont("helvetica","normal"); d.setFontSize(10.5);
  d.text((st.ctx.nome ? st.ctx.nome : "Resultado") + (st.ctx.idade ? ", " + st.ctx.idade + " anos" : "") + " · " + new Date().toLocaleDateString("pt-BR"), M, 28);
  y = 48;
  para("Um retrato de como a sua cabeça tem funcionado, com situações do dia a dia e o porquê de cada uma. É instrumento de autoconhecimento e triagem, não diagnóstico.", 9.5, mut, "italic", 3);
  if(sc.risco){ para("ATENÇÃO: foram marcados pensamentos de se ferir ou de que seria melhor estar morto (PHQ-9). Isso pede cuidado hoje. CVV: 188, 24 horas.", 10, COL.alerta, "bold", 3); }

  // radar
  const N = LIKERT_IDS.length, cx = 70, cy = y + 52, R = 40;
  const pt = (i, v) => { const a = -Math.PI/2 + i*2*Math.PI/N; const r = R*(v-1)/4; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
  const ring = v => LIKERT_IDS.map((_,i) => pt(i,v));
  d.setFillColor(231,244,240); poly(ring(5), "F");
  d.setFillColor(252,242,226); poly(ring(3.5), "F");
  d.setFillColor(240,243,245); poly(ring(2.5), "F");
  d.setDrawColor(...line); d.setLineWidth(0.2); LIKERT_IDS.forEach((_,i) => { const [x2,y2] = pt(i,5); d.line(cx, cy, x2, y2); });
  d.setDrawColor(...COL.alto); d.setLineWidth(0.8); poly(LIKERT_IDS.map((id,i) => pt(i, Math.max(1, sc[id].v))), "S"); d.setLineWidth(0.2);
  LIKERT_IDS.forEach((id,i) => { const [x,yy] = pt(i, Math.max(1, sc[id].v)); d.setFillColor(...COL[sc[id].lv]); d.circle(x, yy, 1.3, "F");
    const [lx,ly] = pt(i, 5.9); d.setFont("helvetica","normal"); d.setFontSize(7.5); d.setTextColor(...ink);
    d.text(VIDA[id].curto, lx, ly+1, {align: Math.abs(lx-cx)<3 ? "center" : (lx>cx ? "left" : "right")}); });
  // legenda por nível
  let ly = y + 14; const lx = 128;
  [["alto","Bem presente"],["medio","Intermediário"],["baixo","Pouco presente"]].forEach(([lv,lab]) => {
    const ids = SCALES.filter(s => sc[s.id].lv===lv || (lv==="alto" && sc[s.id].lv==="alerta")).map(s => VIDA[s.id].curto);
    d.setFillColor(...COL[lv]); d.circle(lx+1.5, ly-1.2, 1.5, "F");
    d.setFont("helvetica","bold"); d.setFontSize(10); d.setTextColor(...COL[lv]); d.text(lab, lx+5, ly);
    ly += 5; d.setFont("helvetica","normal"); d.setFontSize(9); d.setTextColor(...ink);
    const ls = d.splitTextToSize(ids.length ? ids.join(", ") : "nenhuma", W-M-lx); ls.forEach(l => { d.text(l, lx+5, ly); ly += 4.2; }); ly += 4;
  });
  y = cy + R + 14;
  para("Quanto mais a forma verde se afasta do centro, mais a área aparece. Anéis em 2,5 e 3,5 numa escala de 1 a 5. Depressão e ansiedade medem só as últimas duas semanas e ficam fora do radar.", 8, mut, "italic", 2);

  head("Leitura do conjunto"); syn.L.forEach(t => bullet(t));
  const lidas = situacoesLidas(sc);
  if(lidas.length){ head("As situações que você contou");
    lidas.forEach(x => { need(24); para("\u201c" + x.txt + "\u201d", 10, ink, "italic", 1);
      if(x.ids.length){ para("Conversa com: " + x.ids.map(id => VIDA[id].curto).join(", "), 9, COL[sc[x.ids[0]].lv], "bold", 1);
        para("Por que pode estar acontecendo: " + (x.porque || VIDA[x.ids[0]].porque), 9.5, ink, "normal", 0.8);
        para("O que costuma ajudar: " + (x.ajuda || VIDA[x.ids[0]].ajuda), 9.5, ink, "normal", 3); }
      else if(x.porque){ para(x.porque, 9.5, ink, "normal", 0.8); para("O que costuma ajudar: " + x.ajuda, 9.5, ink, "normal", 3); }
      else para("Não deu para ligar a uma área pelas palavras usadas; vale levar ao profissional do jeito que está.", 9.5, mut, "normal", 3); }); }

  // cartões
  const rk = rankScales(sc);
  y += 6; need(90);
  d.setFont("helvetica","bold"); d.setFontSize(16); d.setTextColor(...ink); d.text("O que você pode estar vivendo", M, y); y += 6;
  para("Da área mais forte para a mais leve. Veja se as situações batem com a sua vida.", 9.5, mut, "normal", 4);
  rk.present.forEach(s => {
    const r = sc[s.id], v = VIDA[s.id], col = COL[r.lv], tint = TINT[r.lv], IW = CW - 10;
    d.setFont("helvetica","normal");
    const dia = v.dia.map(t => wrap(t, 9.5, IW-5)), por = wrap(v.porque, 9.5, IW), aj = wrap(v.ajuda, 9.5, IW);
    const lh = 4;
    const h = 22 + 6 + dia.reduce((a,b)=>a+b.length*lh+1,0) + 6 + por.length*lh + 6 + aj.length*lh + 6;
    need(h);
    const top = y;
    d.setFillColor(...tint); d.roundedRect(M, top, CW, h, 2.5, 2.5, "F");
    d.setFillColor(...col); d.rect(M, top, CW, 1.6, "F");
    let yy = top + 9;
    d.setFont("helvetica","bold"); d.setFontSize(12.5); d.setTextColor(...ink); d.text(s.nome, M+5, yy);
    d.setFontSize(9.5); d.setTextColor(...col); d.text(LVTXT[r.lv] + " · " + r.txt, W-M-5, yy, {align:"right"});
    yy += 4;
    d.setFillColor(255,255,255); d.roundedRect(M+5, yy, IW, 2.6, 1.3, 1.3, "F");
    d.setFillColor(...col); d.roundedRect(M+5, yy, Math.max(2.6, IW*r.pct), 2.6, 1.3, 1.3, "F");
    yy += 9;
    const sub = t => { d.setFont("helvetica","bold"); d.setFontSize(9); d.setTextColor(...col); d.text(t.toUpperCase(), M+5, yy); yy += 5; d.setFont("helvetica","normal"); d.setFontSize(9.5); d.setTextColor(...ink); };
    sub("No dia a dia, isso pode aparecer assim");
    dia.forEach(ls => { d.text("•", M+5, yy); ls.forEach(l => { d.text(l, M+10, yy); yy += lh; }); yy += 1; });
    yy += 2; sub("Por que acontece"); por.forEach(l => { d.text(l, M+5, yy); yy += lh; });
    yy += 2; sub("O que costuma ajudar"); aj.forEach(l => { d.text(l, M+5, yy); yy += lh; });
    y = top + h + 5;
  });
  if(rk.quiet.length){ head("Aparece pouco em você"); rk.quiet.forEach(s => bullet(s.nome + " · " + sc[s.id].txt)); }

  if(bf.length){ head("Cruzamento com o Big Five"); bf.forEach(t => bullet(t)); }
  head("Perguntas para levar ao profissional");
  if(st.ctx.med) para("Remédios psiquiátricos em uso: " + st.ctx.med, 10, ink, "bold", 2);
  (syn.Q.length ? syn.Q : ["Nenhuma área ficou alta; leve as dúvidas que ainda tiver."]).forEach(t => bullet(t));
  para("Autismo, TDAH e altas habilidades: avaliação neuropsicológica completa. Humor, depressão e ansiedade: psiquiatra.", 9.5, mut, "italic", 2);
  head("Como se preparar para a avaliação"); PREP.forEach(t => bullet(t));
  para("Baseado no e-book Superdotação: da suspeita à confirmação técnica, de Elô Lima.", 8.5, mut, "italic", 2);
  head("O que cada escala mede e como confirmar");
  SCALES.forEach(s => { need(16); para(s.termo, 10.5, ink, "bold", 0.5); para(s.explica, 9.5, ink, "normal", 0.5); para("Teste oficial: " + s.oficial, 9, mut, "italic", 2.5); });
  head("Glossário");
  GLOSS.forEach(g => { need(10); para(g[0], 10, ink, "bold", 0.3); para(g[1], 9.5, ink, "normal", 2); });
  head("Respostas");
  ITEMS.forEach((it,ix) => { const s = scaleOf(it.s); const a = st.ans[ix]; const lab = a===undefined ? "-" : (s.tipo==="lik" ? (a+1)+" " + LIK[a] : a+" " + FREQ[a]);
    d.setFont("helvetica","normal"); const lines = wrap((ix+1) + ". " + it.t + (it.r ? " (invertido)" : ""), 8, CW-45); need(3.6*lines.length);
    d.setFontSize(8); d.setTextColor(...ink); lines.forEach((l,j) => d.text(l, M, y + j*3.6));
    d.setTextColor(...mut); d.text(lab, W-M, y, {align:"right"}); y += 3.6*lines.length + 1; });

  const pages = d.getNumberOfPages();
  for(let p=1;p<=pages;p++){ d.setPage(p); d.setFont("helvetica","normal"); d.setFontSize(7.5); d.setTextColor(...mut);
    d.text("Mapa da Mente · rastreio, não diagnóstico · mapa-da-mente.netlify.app · página " + p + " de " + pages, M, 290); }

  const blob = d.output("blob");
  const fname = "mapa-da-mente" + (st.ctx.nome ? "-" + st.ctx.nome.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-") : "") + ".pdf";
  msg.textContent = "";
  let dl = null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){ dl = null; }
  if(dl){
    try{ await dl.save({filename:fname, data:blob}); msg.textContent = "PDF salvo."; }
    catch(e){ msg.textContent = e && e.code==="declined" ? "Download cancelado." : "Não deu para salvar aqui. Tente abrir a página no navegador."; }
  } else {
    try{ const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); msg.textContent = "PDF gerado. Confira sua pasta de downloads."; }
    catch(e){ msg.textContent = "Não deu para baixar aqui. Abra esta página direto no navegador."; }
  }
}
